<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monero WASM Miner</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff6600;
            --text-color: #e0e0e0;
            --console-bg: #000000;
            --input-bg: #2d2d2d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #aaa;
            font-weight: bold;
        }

        input {
            background-color: var(--input-bg);
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .control-panel {
            margin: 20px 0;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover:not(:disabled) {
            background-color: #e05500;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .console-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #aaa;
        }

        .console {
            background-color: var(--console-bg);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            height: 320px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            box-sizing: border-box;
        }

        .log-entry {
            margin-bottom: 4px;
            word-break: break-all;
        }

        .log-wasm { color: #00ff00; }
        .log-error { color: #ff3333; }
        .log-info { color: #00bfff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Monero Web Miner (WASM + Threads)</h1>
        
        <!-- Configuração de inputs do usuário -->
        <div class="input-group">
            <label for="walletInput">Endereço da Carteira Monero (XMR):</label>
            <input type="text" id="walletInput" placeholder="Ex: 4657q4dnsjLWtzeW4XN3wG9..." value="4657q4dnsjLWtzeW4XN3wG9swFumWAZB9i1pegTLMxVAQy5E5AE8uif42kkHWcWc9vDcLUmzeCf3pV7mmrJQQqqe84dtASi">
        </div>

        <div class="input-group">
            <label for="workerInput">Nome do Worker (Identificador):</label>
            <input type="text" id="workerInput" placeholder="Ex: web_worker_01" value="WasmMinerHtml">
        </div>

        <div class="control-panel">
            <button id="startBtn" disabled>Iniciar Mineração</button>
        </div>

        <div class="console-label">Terminal de Saída:</div>
        <div class="console" id="logConsole">
            <div class="log-entry log-info">[SISTEMA] Inicializando ambiente e carregando runtime do WebAssembly...</div>
        </div>
    </div>

    <!-- 1. Configuração de ganchos do MinerModule ANTES do script carregar -->
    <script>
        const logConsole = document.getElementById('logConsole');

        function appendToConsole(text, type = 'wasm') {
            if (!logConsole) return;
            const entry = document.createElement('div');
            entry.classList.add('log-entry', `log-${type}`);
            entry.textContent = text;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        // Casamento perfeito com o EXPORT_NAME="MinerModule" definido no seu Makefile
        window.MinerModule = {
            print: function(text) {
                console.log(text);
                appendToConsole(text, 'wasm');
            },
            printErr: function(text) {
                console.error(text);
                // Evita espalhar logs de warnings irrelevantes na interface
                if (!text.includes("missing function") && !text.includes("deprecated")) {
                    appendToConsole(text, 'error');
                }
            },
            onRuntimeInitialized: function() {
                appendToConsole("[SISTEMA] Módulo WebAssembly e pool de threads inicializados com sucesso na Cloud Vercel!", 'info');
                document.getElementById('startBtn').disabled = false;
            }
        };

        // Redirecionamento de segurança para o Emscripten mapear as saídas locais
        window.Module = window.MinerModule;
    </script>

    <!-- 2. Leitura do orquestrador JavaScript nativo gerado pelo compilador -->
    <script src="bin/miner.js"></script>

    <!-- 3. Controle e envio de parâmetros da carteira para o motor C++ -->
    <script>
        document.getElementById('startBtn').addEventListener('click', () => {
            const startBtn = document.getElementById('startBtn');
            const walletAddress = document.getElementById('walletInput').value.trim();
            const workerName = document.getElementById('workerInput').value.trim();

            if (!walletAddress) {
                appendToConsole("[ERRO] Por favor, insira uma carteira Monero antes de iniciar.", "error");
                return;
            }

            startBtn.disabled = true;
            appendToConsole("[SISTEMA] Alocando memória e disparando 'startMining' via ccall...", 'info');

            try {
                let success = false;
                const targetModule = window.MinerModule || window.Module;

                // Executa a injeção segura de strings via ccall do Emscripten
                if (targetModule && typeof targetModule.ccall === "function") {
                    success = targetModule.ccall(
                        'startMining',       // Assinatura exposta via extern "C"
                        'boolean',           // Tipo retornado pelo método
                        ['string', 'string'],// Assinatura dos tipos dos argumentos
                        [walletAddress, workerName] // Dados capturados dos inputs do formulário
                    );
                } else {
                    throw new Error("O subsistema de controle de memória das threads não está pronto.");
                }

                if (success) {
                    appendToConsole("[SISTEMA] 🚀 Sucesso! O loop do minerador foi ativado em background nas threads filhas.", 'info');
                } else {
                    appendToConsole("[SISTEMA] ❌ O motor startMining() recusou a chamada ou falhou internamente.", 'error');
                    startBtn.disabled = false;
                }

            } catch (err) {
                appendToConsole("Falha crítica de execução: " + err.message, 'error');
                console.error(err);
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
