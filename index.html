<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monero WASM Miner</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eee;
    padding: 20px;
}
#log{
    background: #000;
    height: 300px;
    overflow: auto;
    padding: 10px;
    white-space: pre-wrap;
    font-family: monospace;
    border: 1px solid #333;
    margin-top: 10px;
}
input, button{
    margin: 4px;
    padding: 8px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 4px;
}
input{
    width: 280px;
}
button:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
}
button:not(:disabled) {
    background: #f60;
    cursor: pointer;
    font-weight: bold;
}
#stopBtn:not(:disabled) {
    background: #d32f2f;
}
</style>
</head>

<body>

<h2>Monero WASM Miner (Multi-Thread)</h2>

<input id="walletInput" placeholder="Carteira XMR" value=""><br>
<input id="workerInput" value="WasmMinerHtml" placeholder="Worker"><br>

<button id="startBtn" disabled>Iniciar</button>
<button id="stopBtn" disabled>Parar</button>

<div id="log"></div>

<script>
const log = e => {
    document.getElementById("log").textContent += e + "\n";
    const logDiv = document.getElementById("log");
    logDiv.scrollTop = logDiv.scrollHeight;
};

const coresLogicas = navigator.hardwareConcurrency || 4;
const threadsOtimizadas = Math.max(1, Math.floor(coresLogicas / 2));

log(`[SISTEMA] Cores detectados: ${coresLogicas}. Preparando ${threadsOtimizadas} threads.`);

// Resolve a rota absoluta exata baseada no domínio atual da Vercel
const baseScriptUrl = window.location.origin + '/bin/miner.js';

window.Module = {
    numThreads: threadsOtimizadas,
    
    // O TRUQUE PARA O ANDROID: Passar a URL absoluta do servidor Vercel. 
    // Isso diz para o Chrome do Android que o Worker vem do mesmo domínio seguro e verificado.
    mainScriptUrlOrBlob: baseScriptUrl,
    
    INITIAL_MEMORY: 1073741824,
    
    locateFile: function(path) {
        return '/bin/' + path;
    },
    print: function(text) { 
        log(text); 
    },
    printErr: function(text) { 
        log("[WASM LOG] " + text); 
    },
    onAbort: function(err) {
        log("[CRÍTICO] Inicialização abortada: " + err);
    },
    onRuntimeInitialized: function() {
        log("[STATUS] Pronto para minerar (Callback disparado)");
        document.getElementById("startBtn").disabled = false;
    }
};
</script>

<!-- Carregamento Nativo via Script Tag (Como o Android prefere para validar a origem) -->
<script src="/bin/miner.js" 
        onload="log('[SISTEMA] Binário miner.js carregado com sucesso pelo navegador.')"
        onerror="log('[ERRO] Arquivo miner.js não foi encontrado em /bin/miner.js')">
</script>

<script>
// Varredura de segurança para destravar o Android se o script inicializar sem rodar o callback
const varreMemoria = setInterval(() => {
    const btn = document.getElementById("startBtn");
    if (btn.disabled && (window.Module.ccall || window.Module._startMining || window.Module.asm)) {
        log("[SISTEMA] Funções de mineração mapeadas na memória global. Liberando botão.");
        btn.disabled = false;
        clearInterval(varreMemoria);
    }
}, 1500);

// Controles do Minerador
const start = document.getElementById("startBtn");
const stop = document.getElementById("stopBtn");

start.onclick = () => {
    let wallet = document.getElementById("walletInput").value.trim();
    let worker = document.getElementById("workerInput").value.trim();

    if (!wallet) {
        log("[AVISO] Digite sua carteira XMR.");
        return;
    }

    start.disabled = true;
    log(`[STATUS] Conectando pipeline com ${window.Module.numThreads || threadsOtimizadas} threads ativos...`);

    try {
        let result = window.Module.ccall(
            "startMining",
            "boolean",
            ["string", "string"],
            [wallet, worker]
        );

        if (result) {
            log("[STATUS] Minerando!");
            stop.disabled = false;
        } else {
            log("[STATUS] A função startMining recusou a inicialização.");
            start.disabled = false;
        }
    } catch (e) {
        log("[ERRO C++] Falha na ponte WebAssembly: " + e.message);
        start.disabled = false;
    }
};

stop.onclick = () => {
    try {
        window.Module.ccall("stopMining", null, [], []);
        log("[STATUS] Minerador parado.");
        start.disabled = false;
        stop.disabled = true;
    } catch (e) {
        log("[ERR] Falha ao parar: " + e.message);
    }
};
</script>

</body>
</html>
