<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Wasm Monero Miner</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .console { background: #000; padding: 15px; border-radius: 5px; font-family: monospace; height: 300px; overflow-y: scroll; border: 1px solid #333; }
        button { padding: 10px 20px; font-size: 16px; background: #ff6600; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #555; }
    </style>
</head>
<body>

    <h1>Monero Web Miner (WASM + Threads)</h1>
    <button id="startBtn">Iniciar Mineração</button>
    
    <h3>Log do Minerador:</h3>
    <div class="console" id="logConsole">Aguardando comando...</div>

    <!-- Importa o arquivo JS gerado pelo Emscripten -->
    <script src="bin/miner.js"></script>

    <script>
        const logConsole = document.getElementById('logConsole');
        const startBtn = document.getElementById('startBtn');

        // Redireciona os prints do C++ (std::cout / Utils::threadSafePrint) direto para a tela do navegador
        window.Module = {
            print: function(text) {
                console.log(text);
                logConsole.innerHTML += `<div>[WASM] ${text}</div>`;
                logConsole.scrollTop = logConsole.scrollHeight;
            },
            printErr: function(text) {
                console.error(text);
                logConsole.innerHTML += `<div style="color: #ff3333;">[ERRO] ${text}</div>`;
                logConsole.scrollTop = logConsole.scrollHeight;
            },
            onRuntimeInitialized: function() {
                window.Module.print("Módulo WebAssembly carregado com sucesso!");
                startBtn.disabled = false;
            }
        };

        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            window.Module.print("Iniciando minerador...");

            try {
                // Vincula a função exportada do C++ para o JavaScript
                const startMining = window.Module.cwrap('startMining', 'boolean', []);
                
                // Executa a mineração!
                const success = startMining();
                
                if (success) {
                    window.Module.print("🚀 startMining() executado e rodando em segundo plano!");
                } else {
                    window.Module.print("❌ Falha interna ao executar startMining().");
                }
            } catch (err) {
                window.Module.printErr("Erro ao chamar a função WASM: " + err.message);
            }
        });
    </script>
</body>
</html>
