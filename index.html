<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monero WASM Miner</title>

<style>
body{
    font-family:Arial;
    background:#121212;
    color:#eee;
    padding:20px
}
#log{
    background:#000;
    height:300px;
    overflow:auto;
    padding:10px;
    white-space:pre-wrap
}
input,button{
    margin:4px;
    padding:8px
}
</style>
</head>

<body>

<h2>Monero WASM Miner</h2>

<input id="walletInput" placeholder="Carteira XMR"><br>
<input id="workerInput" value="WasmMinerHtml" placeholder="Worker"><br>

<button id="startBtn" disabled>Iniciar</button>
<button id="stopBtn" disabled>Parar</button>

<div id="log"></div>

<script>
const log = e => {
    document.getElementById("log").textContent += e + "\n";
};

const coresLogicas = navigator.hardwareConcurrency || 4;
const threadsOtimizadas = Math.max(1, Math.floor(coresLogicas / 2));

log(`[SISTEMA] Cores detectados: ${coresLogicas}. Preparando ${threadsOtimizadas} threads.`);

// Força a criação do objeto Module no escopo global absoluto
window.Module = {
    numThreads: threadsOtimizadas,
    
    // Força o Emscripten a entender a rota local exata na Vercel
    mainScriptUrlOrBlob: window.location.origin + '/bin/miner.js',
    
    locateFile: function(path) {
        return '/bin/' + path;
    },

    print(text){
        log(text);
    },

    printErr(text){
        log("[ERR] " + text);
    },

    // Captura erros críticos que o Emscripten costuma ocultar do console
    onAbort(what) {
        log("[CRÍTICO] O WebAssembly abortou a inicialização: " + what);
    },

    onRuntimeInitialized(){
        log("[STATUS] pronto para minerar (onRuntimeInitialized disparado)");
        document.getElementById("startBtn").disabled = false;
    }
};

// MOTOR DE VERIFICAÇÃO FORÇADA
// Se após 4 segundos o runtime não disparar o callback padrão, mas o código JS
// já tiver injetado as funções de C++ no objeto Module, nós forçamos a ativação do botão.
setInterval(() => {
    const btn = document.getElementById("startBtn");
    if (btn.disabled && (window.Module.ccall || window.Module._startMining || window.Module.asm)) {
        log("[SISTEMA] Runtime detectado na memória via varredura secundária. Ativando botão!");
        btn.disabled = false;
    }
}, 2000);
</script>

<!-- Carrega o script unificado embutido gerado via GitHub Actions -->
<script src="./bin/miner.js"></script>

<script>
const start=document.getElementById("startBtn");
const stop=document.getElementById("stopBtn");

start.onclick=()=>{
    start.disabled=true;

    let wallet = document.getElementById("walletInput").value.trim();
    let worker = document.getElementById("workerInput").value.trim();

    if(!wallet) {
        log("[AVISO] Insira uma carteira XMR válida.");
        start.disabled=false;
        return;
    }

    log(`[STATUS] Inicializando threads e conectando a pool...`);

    // 3. Executa a função do minerador forçada pelo C++
    let result = Module.ccall(
        "startMining",
        "boolean",
        ["string","string"],
        [wallet,worker]
    );

    if(result){
        log("[STATUS] minerando em segundo plano (multi-thread active)");
        stop.disabled=false;
    }else{
        log("[STATUS] falha ao iniciar");
        start.disabled=false;
    }
};

stop.onclick=()=>{
    Module.ccall(
        "stopMining",
        null,
        [],
        []
    );

    log("[STATUS] parado");
    start.disabled=false;
    stop.disabled=true;
};
</script>

</body>
</html>

</body>
</html>
