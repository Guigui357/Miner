<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monero Web Miner</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .miner-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; margin: 20px auto; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; }
        .btn { width: 100%; padding: 10px; font-weight: bold; color: white; background: #28a745; border: none; border-radius: 4px; cursor: pointer; }
        .btn.mining { background: #dc3545; }
        .stats { margin-top: 15px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="miner-container">
        <div class="field">
            <label>Endereço de Carteira XMR:</label>
            <input type="text" id="walletInput" value="4657q4dnsjLWtzeW4XN3wG9swFumWAZB9i1pegTLMxVAQy5E5AE8uif42kkHWcWc9vDcLUmzeCf3pV7mmrJQQqqe84dtASi">
        </div>

        <button id="minerButton" class="btn" onclick="toggleMining()">Iniciar Mineração</button>

        <div class="stats">
            <div>Velocidade: <span id="hashrate">0 H/s</span></div>
            <div>Total Hashes: <span id="totalHashes">0</span></div>
        </div>
    </div>

    <!-- Chama o arquivo miner.js que está na mesma pasta -->
    <script src="miner.js"></script>

    <script>
        var isMining = false;
        var statsInterval;

        function toggleMining() {
            var btn = document.getElementById("minerButton");
            var input = document.getElementById("walletInput");
            var hashrateTxt = document.getElementById("hashrate");
            var totalTxt = document.getElementById("totalHashes");

            if (!isMining) {
                var currentWallet = input.value.trim();
                if (currentWallet === "") {
                    alert("Por favor, digite uma carteira.");
                    return;
                }

                input.disabled = true;

                // Executa as funções globais que existem dentro do seu miner.js
                startMining("moneroocean.stream", currentWallet, "GH-XMR", -1, "");
                
                btn.innerText = "Parar Mineração";
                btn.classList.add("mining");
                isMining = true;

                // Loop que monitora a variável totalhashes nativa do miner.js
                let lastHashes = 0;
                statsInterval = setInterval(function() {
                    if (typeof totalhashes !== 'undefined') {
                        var currentTotal = totalhashes;
                        var diff = currentTotal - lastHashes;
                        lastHashes = currentTotal;

                        hashrateTxt.innerText = diff + " H/s";
                        totalTxt.innerText = currentTotal;
                    }
                }, 1000);

            } else {
                clearInterval(statsInterval);
                stopMining(); // Para a execução do miner.js
                
                hashrateTxt.innerText = "0 H/s";
                input.disabled = false;
                btn.innerText = "Iniciar Mineração";
                btn.classList.remove("mining");
                isMining = false;
            }
        }
    </script>
</body>
</html>
