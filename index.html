<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>MoneroMiner WASM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
        }

        body {
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 18px;
            color: #aaa;
            font-size: 14px;
        }

        .panel {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 14px;
        }

        .status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status-box {
            background: #121212;
            border: 1px solid #292929;
            border-radius: 8px;
            padding: 12px;
        }

        .label {
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            word-break: break-word;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #startBtn {
            background: #198754;
        }

        #stopBtn {
            background: #dc3545;
        }

        #log {
            width: 100%;
            height: 420px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;

            background: #050505;
            border: 1px solid #292929;
            border-radius: 8px;

            padding: 12px;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: 12px;
            line-height: 1.45;
        }

        .warning {
            color: #ffcc66;
        }

        .success {
            color: #66dd88;
        }

        .error {
            color: #ff6666;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .status {
                grid-template-columns: 1fr;
            }

            #log {
                height: 360px;
                font-size: 11px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MoneroMiner WASM</h1>

    <div class="subtitle">
        RandomX + Emscripten + WasmJit
    </div>

    <div class="panel">

        <div class="status">

            <div class="status-box">
                <div class="label">CPU threads</div>
                <div class="value" id="threads">detectando...</div>
            </div>

            <div class="status-box">
                <div class="label">Emscripten</div>
                <div class="value" id="emscriptenStatus">
                    aguardando...
                </div>
            </div>

            <div class="status-box">
                <div class="label">Miner</div>
                <div class="value" id="minerStatus">
                    parado
                </div>
            </div>

            <div class="status-box">
                <div class="label">WasmJit</div>
                <div class="value" id="jitStatus">
                    aguardando...
                </div>
            </div>

        </div>

    </div>

    <div class="panel">

        <div class="buttons">

            <button
                id="startBtn"
                disabled
            >
                Iniciar mineração
            </button>

            <button
                id="stopBtn"
                disabled
            >
                Parar mineração
            </button>

        </div>

    </div>

    <div class="panel">

        <div class="label">Console</div>

        <div id="log"></div>

    </div>

</div>


<script>
"use strict";

/*
 * ============================================================
 * MONEROMINER WASM - FRONTEND
 * ============================================================
 */

const logElement = document.getElementById("log");

const startButton = document.getElementById("startBtn");
const stopButton = document.getElementById("stopBtn");

const threadsElement =
    document.getElementById("threads");

const emscriptenStatusElement =
    document.getElementById("emscriptenStatus");

const minerStatusElement =
    document.getElementById("minerStatus");

const jitStatusElement =
    document.getElementById("jitStatus");


/*
 * ============================================================
 * LOG
 * ============================================================
 */

function log(message) {

    const text = String(message);

    console.log(text);

    if (!logElement) {
        return;
    }

    logElement.textContent += text + "\n";

    logElement.scrollTop =
        logElement.scrollHeight;
}


/*
 * ============================================================
 * ERROS GLOBAIS
 * ============================================================
 */

window.addEventListener("error", function(event) {

    log(
        "[JS-ERROR] " +
        (event.message || "Erro JavaScript")
    );

    if (event.filename) {
        log(
            "[JS-ERROR] arquivo: " +
            event.filename
        );
    }

    if (event.lineno) {
        log(
            "[JS-ERROR] linha: " +
            event.lineno
        );
    }
});


window.addEventListener(
    "unhandledrejection",
    function(event) {

        log(
            "[PROMISE-ERROR] " +
            String(event.reason)
        );
    }
);


/*
 * ============================================================
 * THREADS
 * ============================================================
 */

const hardwareThreads =
    navigator.hardwareConcurrency || 4;


/*
 * Não usar todos os cores no navegador.
 *
 * Isso evita deixar o dispositivo completamente travado.
 */

const threadsOtimizadas =
    Math.max(
        1,
        Math.floor(hardwareThreads / 2)
    );


threadsElement.textContent =
    hardwareThreads +
    " detectados / " +
    threadsOtimizadas +
    " selecionados";


log(
    "[SISTEMA] CPU threads: " +
    hardwareThreads
);

log(
    "[SISTEMA] Threads selecionados: " +
    threadsOtimizadas
);


/*
 * ============================================================
 * CONFIGURAÇÃO EMSCRIPTEN
 * ============================================================
 *
 * IMPORTANTE:
 *
 * NÃO fazemos:
 *
 *   WebAssembly.Memory = ...
 *
 * NÃO forçamos:
 *
 *   1 GB
 *   2 GB
 *   shared memory manual
 *
 * O próprio Emscripten deve criar e administrar
 * a memória do módulo.
 *
 * Isso é especialmente importante no iOS/WebKit.
 * ============================================================
 */


window.Module = {

    /*
     * Pthreads/Emscripten
     */

    numThreads: threadsOtimizadas,


    /*
     * Onde estão os arquivos gerados pelo Emscripten.
     */

    locateFile: function(path) {

        return "/bin/" + path;
    },


    /*
     * stdout
     */

    print: function(text) {

        log("[WASM] " + text);
    },


    /*
     * stderr
     */

    printErr: function(text) {

        log("[WASM-ERR] " + text);
    },


    /*
     * Abort do Emscripten.
     */

    onAbort: function(reason) {

        log(
            "[ABORT] " +
            String(reason)
        );

        minerStatusElement.textContent =
            "abortado";

        startButton.disabled = true;
        stopButton.disabled = true;
    },


    /*
     * Chamado quando o runtime Emscripten terminou
     * de inicializar.
     */

    onRuntimeInitialized: function() {

        log(
            "[STATUS] Emscripten inicializado."
        );

        emscriptenStatusElement.textContent =
            "inicializado";


        /*
         * Verificar APIs disponíveis.
         */

        if (
            typeof Module.ccall ===
            "function"
        ) {

            log(
                "[STATUS] Module.ccall disponível."
            );

        } else {

            log(
                "[STATUS] Module.ccall não disponível."
            );
        }


        /*
         * Procurar exports reais.
         *
         * Não assumimos que _startMining existe.
         */

        const exportsEncontrados = [];


        for (
            const key in Module
        ) {

            if (
                key.startsWith("_")
            ) {

                exportsEncontrados.push(key);
            }
        }


        if (
            exportsEncontrados.length > 0
        ) {

            log(
                "[EXPORTS] " +
                exportsEncontrados.join(", ")
            );

        } else {

            log(
                "[EXPORTS] Nenhum export _* encontrado."
            );
        }


        /*
         * Verificar especificamente o startMining.
         */

        if (
            typeof Module._startMining ===
            "function"
        ) {

            log(
                "[STATUS] Module._startMining encontrado."
            );

            startButton.disabled = false;

        } else {

            log(
                "[STATUS] Module._startMining não encontrado."
            );


            /*
             * Caso o projeto use ccall com função
             * exportada de outra maneira.
             */

            if (
                typeof Module.ccall ===
                "function"
            ) {

                startButton.disabled = false;

            } else {

                log(
                    "[AVISO] Nenhum método conhecido para iniciar o miner."
                );
            }
        }
    }
};


/*
 * ============================================================
 * START MINING
 * ============================================================
 */

function startMining() {

    log(
        "[MINER] Solicitação para iniciar mineração..."
    );


    /*
     * Primeiro tenta o export direto.
     */

    if (
        typeof Module._startMining ===
        "function"
    ) {

        log(
            "[MINER] Chamando Module._startMining()..."
        );

        try {

            Module._startMining();

            minerStatusElement.textContent =
                "minerando";

            startButton.disabled = true;
            stopButton.disabled = false;

            return;

        } catch (error) {

            log(
                "[MINER-ERROR] _startMining(): " +
                String(error)
            );
        }
    }


    /*
     * Depois tenta ccall.
     */

    if (
        typeof Module.ccall ===
        "function"
    ) {

        const possibleNames = [
            "startMining",
            "start_mining",
            "start"
        ];


        for (
            const name of possibleNames
        ) {

            try {

                log(
                    "[MINER] Tentando ccall('" +
                    name +
                    "')..."
                );

                Module.ccall(
                    name,
                    null,
                    [],
                    []
                );

                log(
                    "[MINER] ccall('" +
                    name +
                    "') executado."
                );

                minerStatusElement.textContent =
                    "minerando";

                startButton.disabled = true;
                stopButton.disabled = false;

                return;

            } catch (error) {

                log(
                    "[MINER] '" +
                    name +
                    "' não disponível: " +
                    String(error)
                );
            }
        }
    }


    log(
        "[ERRO] Não foi encontrado um método de inicialização do miner."
    );
}


/*
 * ============================================================
 * STOP MINING
 * ============================================================
 */

function stopMining() {

    log(
        "[MINER] Solicitação para parar mineração..."
    );


    /*
     * Export direto.
     */

    const directStops = [
        "_stopMining",
        "__stopMining",
        "_stop_mining",
        "_stop"
    ];


    for (
        const name of directStops
    ) {

        if (
            typeof Module[name] ===
            "function"
        ) {

            try {

                log(
                    "[MINER] Chamando " +
                    name +
                    "()..."
                );

                Module[name]();

                minerStatusElement.textContent =
                    "parado";

                startButton.disabled = false;
                stopButton.disabled = true;

                return;

            } catch (error) {

                log(
                    "[MINER-ERROR] " +
                    name +
                    ": " +
                    String(error)
                );
            }
        }
    }


    /*
     * ccall.
     */

    if (
        typeof Module.ccall ===
        "function"
    ) {

        const possibleNames = [
            "stopMining",
            "stop_mining",
            "stop"
        ];


        for (
            const name of possibleNames
        ) {

            try {

                Module.ccall(
                    name,
                    null,
                    [],
                    []
                );

                log(
                    "[MINER] ccall('" +
                    name +
                    "') executado."
                );

                minerStatusElement.textContent =
                    "parado";

                startButton.disabled = false;
                stopButton.disabled = true;

                return;

            } catch (error) {

                log(
                    "[MINER] stop '" +
                    name +
                    "' não disponível."
                );
            }
        }
    }


    log(
        "[AVISO] Nenhum método de parada encontrado."
    );
}


/*
 * ============================================================
 * BOTÕES
 * ============================================================
 */

startButton.addEventListener(
    "click",
    startMining
);


stopButton.addEventListener(
    "click",
    stopMining
);


/*
 * ============================================================
 * MONITOR DO WASMJIT
 * ============================================================
 *
 * O C++ imprime:
 *
 * [WASM-JIT] Compilando WebAssembly.Module...
 * [WASM-JIT] WebAssembly.Module = OK
 * [WASM-JIT] WebAssembly.Instance = OK; rx_jit = ACTIVE
 * [WASM-JIT] execucoes=1
 *
 * Aqui apenas detectamos essas mensagens para atualizar
 * o indicador visual.
 * ============================================================
 */

const originalPrint =
    window.Module.print;


window.Module.print =
    function(text) {

        const message =
            String(text);


        /*
         * JIT compilando
         */

        if (
            message.includes(
                "[WASM-JIT] Compilando"
            )
        ) {

            jitStatusElement.textContent =
                "compilando";
        }


        /*
         * Module criado
         */

        if (
            message.includes(
                "[WASM-JIT] WebAssembly.Module = OK"
            )
        ) {

            jitStatusElement.textContent =
                "Module OK";
        }


        /*
         * Instance + rx_jit
         */

        if (
            message.includes(
                "rx_jit = ACTIVE"
            )
        ) {

            jitStatusElement.textContent =
                "ATIVO";

            jitStatusElement.className =
                "value success";
        }


        /*
         * Execução
         */

        if (
            message.includes(
                "[WASM-JIT] execucoes="
            )
        ) {

            jitStatusElement.textContent =
                "EXECUTANDO";

            jitStatusElement.className =
                "value success";
        }


        /*
         * Erro JIT
         */

        if (
            message.includes(
                "[WASM-JIT] runtime error"
            )
        ) {

            jitStatusElement.textContent =
                "ERRO";

            jitStatusElement.className =
                "value error";
        }


        /*
         * Imprime normalmente.
         */

        if (
            typeof originalPrint ===
            "function"
        ) {

            originalPrint.call(
                window.Module,
                message
            );

        } else {

            log(
                "[WASM] " +
                message
            );
        }
    };


/*
 * ============================================================
 * CARREGAMENTO
 * ============================================================
 */

log(
    "[SISTEMA] MoneroMiner WASM"
);

log(
    "[SISTEMA] Carregando /bin/miner.js..."
);


/*
 * Não coloque outro <script src="miner.js">
 * em outro lugar da página.
 */

</script>


<script
    src="/bin/miner.js"
    onload="
        log('[SISTEMA] /bin/miner.js carregado.');
    "
    onerror="
        log('[ERRO] Falha ao carregar /bin/miner.js.');
        minerStatusElement.textContent = 'erro';
    "
></script>


<script>
/*
 * ============================================================
 * PÓS-CARREGAMENTO
 * ============================================================
 */

setTimeout(function() {

    log(
        "[DEBUG] Verificando runtime..."
    );


    if (
        typeof Module ===
        "undefined"
    ) {

        log(
            "[ERRO] Module não existe."
        );

        return;
    }


    log(
        "[DEBUG] Module existe."
    );


    if (
        Module.wasmMemory
    ) {

        log(
            "[DEBUG] Module.wasmMemory disponível."
        );

        try {

            log(
                "[DEBUG] Memória WASM atual: " +
                Module.wasmMemory.buffer.byteLength +
                " bytes"
            );

        } catch (error) {

            log(
                "[DEBUG] Não foi possível ler o tamanho da memória."
            );
        }

    } else {

        log(
            "[DEBUG] Module.wasmMemory ainda não disponível."
        );
    }


    if (
        typeof Module.ccall ===
        "function"
    ) {

        log(
            "[DEBUG] Module.ccall = disponível."
        );
    }


    if (
        typeof Module._startMining ===
        "function"
    ) {

        log(
            "[DEBUG] _startMining = disponível."
        );

        startButton.disabled = false;
    }


}, 3000);


/*
 * ============================================================
 * DETECTOR DE JIT
 * ============================================================
 *
 * Isso não executa o JIT.
 *
 * Apenas mostra no console do navegador se as mensagens
 * do WasmJit aparecerem.
 *
 * O JIT real é chamado pelo:
 *
 * RandomX/src/vm_interpreted.cpp
 *
 * através de:
 *
 * wasmJit.compile(program)
 *
 * e:
 *
 * wasmJit.execute(...)
 *
 * ============================================================
 */

log(
    "[WASM-JIT] Monitor preparado."
);

log(
    "[WASM-JIT] Aguardando execução do RandomX..."
);

</script>

</body>
</html>
