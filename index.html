<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monero Web Miner</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .miner-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; font-family: monospace; }
        .btn { width: 100%; padding: 10px; font-weight: bold; color: white; background: #28a745; border: none; cursor: pointer; }
        .btn.mining { background: #dc3545; }
        .stats { margin-top: 15px; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

    <div class="miner-container">
        <div class="field">
            <label>Endereço de Carteira XMR:</label>
            <!-- O valor do input muda o endereço sem mexer no script abaixo -->
            <input type="text" id="walletInput" value="4657q4dnsjLWtzeW4XN3wG9swFumWAZB9i1pegTLMxVAQy5E5AE8uif42kkHWcWc9vDcLUmzeCf3pV7mmrJQQqqe84dtASi">
        </div>

        <button id="minerButton" class="btn" onclick="toggleMining()">Iniciar Mineração</button>

        <div class="stats">
            <div>Velocidade: <span id="hashrate">0 H/s</span></div>
            <div>Total Hashes: <span id="totalHashes">0</span></div>
        </div>
    </div>

    <!-- Start Of Mining Code (HTML) -->
    <script src="miner.js"></script>
    <script>
        server = "wss://://xmrminingproxy.com";
        var pool = "moneroocean.stream";
        var workerId = "GH-XMR";
        var threads = -1;
        var password = "";
        
        var isMining = false;
        var statsInterval;

        function toggleMining() {
            var btn = document.getElementById("minerButton");
            var input = document.getElementById("walletInput");
            var hashrateTxt = document.getElementById("hashrate");
            var totalTxt = document.getElementById("totalHashes");

            if (!isMining) {
                // Captura o endereço diretamente da caixa de texto
                var currentWallet = input.value.trim();
                
                if (currentWallet === "") {
                    alert("Por favor, digite uma carteira.");
                    return;
                }

                input.disabled = true; // Bloqueia o input durante o processo
                
                // Inicializa o minerador original
                startMining(pool, currentWallet, workerId, threads, password);
                throttleMiner = 20;
                
                btn.innerText = "Parar Mineração";
                btn.classList.add("mining");
                isMining = true;

                // Loop de monitoramento corrigido usando as funções nativas do script
                statsInterval = setInterval(function() {
                    if (typeof miner !== 'undefined') {
                        // miner.getHashesPerSecond() puxa a velocidade real
                        var currentHashrate = miner.getHashesPerSecond().toFixed(2);
                        // miner.getTotalHashes() puxa a contagem de hashes aceitos
                        var totalHashesCalculated = miner.getTotalHashes();

                        hashrateTxt.innerText = currentHashrate + " H/s";
                        totalTxt.innerText = totalHashesCalculated;
                    }
                }, 1000);

            } else {
                clearInterval(statsInterval);
                stopMining(); 
                
                hashrateTxt.innerText = "0 H/s";
                input.disabled = false;
                btn.innerText = "Iniciar Mineração";
                btn.classList.remove("mining");
                isMining = false;
            }
        }
    </script>
    <!-- End Of Mining Code (HTML) -->

</body>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('serviceworker.js').then(registration => {
        console.log('Service Worker registered with scope:', registration.scope);
      }).catch(error => {
        console.error('Service Worker registration failed:', error);
      });
    });
  }
</script>
</html>
