    <!-- Start Of Mining Code (HTML) -->
    <script src="miner.js"></script>
    <script>
        // Garante que a variável exista no escopo global antes do script carregar
        var miner = miner || null; 
        
        server = "wss://://xmrminingproxy.com"; 
        var pool = "moneroocean.stream";
        var workerId = "GH-XMR";
        var threads = -1;
        var password = "";
        
        var isMining = false;
        var statsInterval;

        function toggleMining() {
            var btn = document.getElementById("minerButton");
            var input = document.getElementById("walletInput");
            var hashrateTxt = document.getElementById("hashrate");
            var totalTxt = document.getElementById("totalHashes");

            if (!isMining) {
                var currentWallet = input.value.trim();
                
                if (currentWallet === "") {
                    alert("Por favor, digite uma carteira.");
                    return;
                }

                input.disabled = true;
                
                // Inicializa o minerador do miner.js
                startMining(pool, currentWallet, workerId, threads, password);
                throttleMiner = 20;
                
                btn.innerText = "Parar Mineração";
                btn.classList.add("mining");
                isMining = true;

                // Loop de monitoramento com checagem ativa
                statsInterval = setInterval(function() {
                    // Verifica se o miner.js já instanciou o objeto 'miner' globalmente
                    if (window.miner && typeof window.miner.getHashesPerSecond === 'function') {
                        var currentHashrate = window.miner.getHashesPerSecond().toFixed(2);
                        var totalHashesCalculated = window.miner.getTotalHashes();

                        hashrateTxt.innerText = currentHashrate + " H/s";
                        totalTxt.innerText = totalHashesCalculated;
                    } else {
                        // Se o minerador iniciou mas o WASM ainda está carregando, exibe status de espera
                        hashrateTxt.innerText = "Carregando...";
                    }
                }, 1000);

            } else {
                clearInterval(statsInterval);
                stopMining(); 
                
                hashrateTxt.innerText = "0 H/s";
                input.disabled = false;
                btn.innerText = "Iniciar Mineração";
                btn.classList.remove("mining");
                isMining = false;
            }
        }
    </script>
    <!-- End Of Mining Code (HTML) -->
