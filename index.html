<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monero WASM Miner</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eee;
    padding: 20px;
}
#log{
    background: #000;
    height: 300px;
    overflow: auto;
    padding: 10px;
    white-space: pre-wrap;
    font-family: monospace;

    margin-top: 10px;
}
input, button{
    margin: 4px;

    background: #222;

}
input{
    width: 280px;
}
button:disabled {
    background: #555;

    cursor: not-allowed;
}
button:not(:disabled) {

    cursor: pointer;
    font-weight: bold;
}
#stopBtn:not(:disabled) {

}

<body>

<h2>Monero WASM Miner (Multi-Thread)</h2>

<input id="walletInput" placeholder="Carteira XMR" value=""><br>
<input id="workerInput" value="WasmMinerHtml" placeholder="Worker"><br>

<button id="startBtn" disabled>Iniciar</button>
<button id="stopBtn" disabled>Parar</button>

<div id="log"></div>

<script>
const log = e => {
    document.getElementById("log").textContent += e + "\n";
    const logDiv = document.getElementById("log");
    logDiv.scrollTop = logDiv.scrollHeight;
};

const coresLogicas = navigator.hardwareConcurrency || 4;
const threadsOtimizadas = Math.max(1, Math.floor(coresLogicas / 2));

log(`[SISTEMA] Cores detectados: ${coresLogicas}. Preparando ${threadsOtimizadas} threads.`);

// Interceptador e Patch de Memória Compartilhada para o Android
const originalWasmMemory = WebAssembly.Memory;
WebAssembly.Memory = function(opts) {
    log("[PATCH] Alocação de memória do WebAssembly autorizada.");
    if (opts) {
        opts.initial = 16384; // 1024 MB exigidos pelo binário
        if (!opts.maximum) opts.maximum = 32768;
        opts.shared = true;
    }
    return new originalWasmMemory(opts);
};

// Objeto de configuração global limpo
const minerConfig = {
    numThreads: threadsOtimizadas,
    mainScriptUrlOrBlob: window.location.origin + '/bin/miner.js',
    INITIAL_MEMORY: 1073741824,
    locateFile: function(path) { return '/bin/' + path; },
    print: function(text) { log(text); },
    printErr: function(text) { log("[WASM LOG] " + text); },
    onAbort: function(err) { log("[CRÍTICO] Abortado: " + err); }
};

window.Module = minerConfig;
</script>

<!-- Carrega o script unificado -->
<script src="/bin/miner.js" 
        onload="log('[SISTEMA] Script carregado na página. Tentando vincular a interface C++...')"
        onerror="log('[ERRO] Falha ao carregar /bin/miner.js')">
</script>

<script>
// ACIONADOR ASSÍNCRONO ULTRA-AGRESSIVO
// Se o Emscripten empacotou o minerador como um construtor global de Módulo, 
// o código abaixo força a execução dele passando os parâmetros corretos.
setTimeout(() => {
    try {
        // Testa se o compilador exportou uma função de inicialização assíncrona (Padrão moderno)
        if (typeof MoneroMiner === 'function') {
            log("[SISTEMA] Inicializando via fábrica 'MoneroMiner'...");
            MoneroMiner(window.Module).then(function(instance) {
                window.Module = instance;
                log("[STATUS] Pronto para minerar!");
                document.getElementById("startBtn").disabled = false;
            });
        } else if (typeof Module === 'function') {
            log("[SISTEMA] Inicializando via fábrica 'Module'...");
            Module(window.Module).then(function(instance) {
                window.Module = instance;
                log("[STATUS] Pronto para minerar!");
                document.getElementById("startBtn").disabled = false;
            });
        } else if (window.Module && (window.Module.ccall || window.Module._startMining)) {
            // Se já inicializou sozinho em modo linear clássico
            log("[SISTEMA] Interface clássica detectada.");
            log("[STATUS] Pronto para minerar!");
            document.getElementById("startBtn").disabled = false;
        } else {
            log("[Aviso] Tentando liberação de emergência da interface de controle...");
            // Força a ativação para testes manuais mesmo que o callback padrão tenha demorado
            document.getElementById("startBtn").disabled = false;
        }
    } catch (e) {
        log("[ERRO VINCULAÇÃO] " + e.message);
        document.getElementById("startBtn").disabled = false; // Garante o botão ativo em caso de exceção de escopo
    }
}, 3000);

// Controles do Minerador
const start = document.getElementById("startBtn");
const stop = document.getElementById("stopBtn");

start.onclick = () => {
    let wallet = document.getElementById("walletInput").value.trim();
    let worker = document.getElementById("workerInput").value.trim();

    if (!wallet) {
        log("[AVISO] Por favor, digite sua carteira XMR.");
        return;
    }

    start.disabled = true;
    log(`[STATUS] Invocando 'startMining' com ${window.Module.numThreads || threadsOtimizadas} threads...`);

    try {
        // Tenta executar via chamada clássica do Emscripten
        let result = false;
        
        if (window.Module.ccall) {
            result = window.Module.ccall(
                "startMining",
                "boolean",
                ["string", "string"],
                [wallet, worker]
            );
        } else if (window.Module._startMining) {
            // Fallback caso a função tenha sido exportada de forma direta sem o wrapper ccall
            // Converte strings do JS em ponteiros C++ para o minerador aceitar direto
            const ptrWallet = window.Module.allocateUTF8 ? window.Module.allocateUTF8(wallet) : 0;
            const ptrWorker = window.Module.allocateUTF8 ? window.Module.allocateUTF8(worker) : 0;
            result = window.Module._startMining(ptrWallet, ptrWorker);
        } else {
            throw new Error("Nenhum ponto de entrada C++ ('startMining') foi localizado no arquivo miner.js.");
        }

        if (result) {
            log("[STATUS] Minerando com sucesso!");
            stop.disabled = false;
        } else {
            log("[STATUS] O minerador nativo recusou a inicialização (startMining retornou false).");
            start.disabled = false;
        }
    } catch (e) {
        log("[ERRO DE INTERFACE] Não foi possível chamar a mineração. Detalhes: " + e.message);
        start.disabled = false;
    }
};

stop.onclick = () => {
    try {
        if (window.Module.ccall) {
            window.Module.ccall("stopMining", null, [], []);
        } else if (window.Module._stopMining) {
            window.Module._stopMining();
        }
        log("[STATUS] Minerador parado.");
        start.disabled = false;
        stop.disabled = true;
    } catch (e) {
        log("[ERR] Falha ao parar: " + e.message);
    }
};
</script>

<body>

<h2>Monero WASM Miner (Multi-Thread)</h2>

<input id="walletInput" placeholder="Carteira XMR" value=""><br>
<input id="workerInput" value="WasmMinerHtml" placeholder="Worker"><br>

<button id="startBtn" disabled>Iniciar</button>
<button id="stopBtn" disabled>Parar</button>

<div id="log"></div>

<script>
const log = e => {
    document.getElementById("log").textContent += e + "\n";
    const logDiv = document.getElementById("log");
    logDiv.scrollTop = logDiv.scrollHeight;
};

const coresLogicas = navigator.hardwareConcurrency || 4;
const threadsOtimizadas = Math.max(1, Math.floor(coresLogicas / 2));

log(`[SISTEMA] Cores detectados: ${coresLogicas}. Preparando ${threadsOtimizadas} threads.`);

// --- NOVO PATCH DE MEMÓRIA AJUSTADO PARA AS EXIGÊNCIAS DO ARQUIVO ---
const originalWasmMemory = WebAssembly.Memory;
WebAssembly.Memory = function(opts) {
    log("[PATCH] Capturada tentativa de alocação de memória compartilhada.");
    if (opts) {
        log(`[PATCH] Alocação original solicitada: ${opts.initial} páginas (${(opts.initial * 65536 / 1024 / 1024).toFixed(0)} MB).`);
        
        // Forçamos o valor exato exigido pelo binário (16384 páginas = 1GB), 
        // mas garantindo as propriedades máximas para satisfazer o validador
        opts.initial = 16384; 
        if (!opts.maximum) {
            opts.maximum = 32768; // 2GB máximo tolerado
        }
        opts.shared = true;
    }
    return new originalWasmMemory(opts);
};

window.Module = {
    numThreads: threadsOtimizadas,
    mainScriptUrlOrBlob: window.location.origin + '/bin/miner.js',
    INITIAL_MEMORY: 1073741824, // Sincroniza com as 16384 páginas (1 GB)
    
    locateFile: function(path) {
        return '/bin/' + path;
    },
    print: function(text) { 
        log(text); 
    },
    printErr: function(text) { 
        log("[WASM LOG] " + text); 
    },
    onAbort: function(err) {
        log("[CRÍTICO] Inicialização abortada: " + err);
    },
    onRuntimeInitialized: function() {
        log("[STATUS] Pronto para minerar (Callback nativo disparado)");
        document.getElementById("startBtn").disabled = false;
    }
};
</script>

<!-- Carrega o script principal -->
<script src="/bin/miner.js" 
        onload="log('[SISTEMA] Binário miner.js carregado com sucesso pelo navegador.')"
        onerror="log('[ERRO] Arquivo miner.js não foi encontrado em /bin/miner.js')">
</script>

<script>
// Substitua o bloco de scripts final por este:

const start = document.getElementById("startBtn");
const stop = document.getElementById("stopBtn");

start.onclick = () => {
    let wallet = document.getElementById("walletInput").value.trim();
    let worker = document.getElementById("workerInput").value.trim();

    if (!wallet) {
        log("[AVISO] Por favor, digite sua carteira XMR.");
        return;
    }

    start.disabled = true;
    log(`[STATUS] Procurando função de mineração correspondente em memória...`);

    // RASTREADOR DE FUNÇÕES: Varre o objeto Module em busca de qualquer menção a "mining" ou "start"
    let funcoesEncontradas = [];
    if (window.Module) {
        for (let prop in window.Module) {
            if (prop.toLowerCase().includes("min") || prop.toLowerCase().includes("start")) {
                funcoesEncontradas.push(prop);
            }
        }
    }
    
    if (funcoesEncontradas.length > 0) {
        log(`[RASTREADOR] Funções nativas detectadas: [${funcoesEncontradas.join(", ")}]`);
    } else {
        log(`[RASTREADOR] Nenhuma função óbvia encontrada com 'min' ou 'start'.`);
    }

    try {
        let result = false;
        
        // 1. Tenta variações de nomes comuns gerados pelo compilador do MoneroMiner
        if (window.Module.ccall) {
            // Tenta as três variações mais comuns de exportação de string do Emscripten
            const funcoesParaTestar = ["startMining", "start_mining", "start"];
            for (let func of funcoesParaTestar) {
                try {
                    result = window.Module.ccall(func, "boolean", ["string", "string"], [wallet, worker]);
                    if (result) { log(`[SISTEMA] Conectado via ccall("${func}")!`); break; }
                } catch(e) {}
            }
        }
        
        // 2. Tenta execução direta pelos ponteiros do C++ (Caso o ccall tenha sido removido na otimização -O3)
        if (!result) {
            const ptrWallet = window.Module.allocateUTF8 ? window.Module.allocateUTF8(wallet) : 0;
            const ptrWorker = window.Module.allocateUTF8 ? window.Module.allocateUTF8(worker) : 0;
            
            // Varre as variações diretas de sublinhado do compilador do Linux/Actions
            const metodosDiretos = ["_startMining", "__startMining", "_start_mining", "_start"];
            for (let metodo of metodosDiretos) {
                if (typeof window.Module[metodo] === 'function') {
                    log(`[SISTEMA] Tentando execução direta via window.Module.${metodo}...`);
                    result = window.Module[metodo](ptrWallet, ptrWorker);
                    if (result || result === undefined) { 
                        result = true; 
                        log(`[STATUS] Invocado com sucesso via ${metodo}!`);
                        break; 
                    }
                }
            }
        }

        if (result) {
            log("[STATUS] Minerador inicializado com sucesso (Multi-threads ativas)!");
            stop.disabled = false;
        } else {
            throw new Error("O ponto de entrada C++ não respondeu a nenhum dos formatos de teste padrão.");
        }
    } catch (e) {
        log("[ERRO DE INTERFACE] " + e.message);
        start.disabled = false;
    }
};

stop.onclick = () => {
    try {
        const paradas = ["stopMining", "stop_mining", "stop", "_stopMining", "_stop_mining"];
        for (let p of paradas) {
            if (window.Module.ccall) {
                try { window.Module.ccall(p, null, [], []); } catch(e) {}
            }
            if (typeof window.Module[p] === 'function') {
                try { window.Module[p](); } catch(e) {}
            }
        }
        log("[STATUS] Comando de parada enviado.");
        start.disabled = false;
        stop.disabled = true;
    } catch (e) {
        log("[ERR] Falha ao parar: " + e.message);
    }
};
</script>
