<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monero WASM Miner</title>

<style>
body{
    font-family:Arial;
    background:#121212;
    color:#eee;
    padding:20px
}
#log{
    background:#000;
    height:300px;
    overflow:auto;
    padding:10px;
    white-space:pre-wrap
}
input,button{
    margin:4px;
    padding:8px
}
</style>
</head>

<body>

<h2>Monero WASM Miner</h2>

<input id="walletInput" placeholder="Carteira XMR"><br>
<input id="workerInput" value="WasmMinerHtml" placeholder="Worker"><br>

<button id="startBtn" disabled>Iniciar</button>
<button id="stopBtn" disabled>Parar</button>

<div id="log"></div>


<script>

const log = e => {
    document.getElementById("log").textContent += e + "\n";
};


var Module = {

    print(text){
        log(text);
    },

    printErr(text){
        log("[ERR] " + text);
    },

    onRuntimeInitialized(){

        log("[STATUS] ready");

        document.getElementById("startBtn").disabled=false;
    }
};


</script>


<script src="./bin/miner.js"></script>


<script>

const start=document.getElementById("startBtn");
const stop=document.getElementById("stopBtn");


start.onclick=()=>{

    start.disabled=true;

    let wallet =
        document.getElementById("walletInput")
        .value.trim();

    let worker =
        document.getElementById("workerInput")
        .value.trim();


    let result = Module.ccall(
        "startMining",
        "boolean",
        ["string","string"],
        [wallet,worker]
    );


    if(result){

        log("[STATUS] running");
        stop.disabled=false;

    }else{

        log("[STATUS] falha ao iniciar");
        start.disabled=false;
    }

};


stop.onclick=()=>{

    Module.ccall(
        "stopMining",
        null,
        [],
        []
    );


    log("[STATUS] stopped");

    start.disabled=false;
    stop.disabled=true;

};


</script>

</body>
</html>
